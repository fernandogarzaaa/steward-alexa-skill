<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Steward - Alexa+ Agent Skill (simulated experience)</title>
<style>
  :root { color-scheme: dark; }
  body { font-family: system-ui, -apple-system, sans-serif; background: #0d1117;
         color: #e6edf3; margin: 0; display: flex; flex-direction: column;
         height: 100vh; height: 100dvh; }
  header { padding: 14px 20px; border-bottom: 1px solid #21262d; }
  header h1 { font-size: 18px; margin: 0; }
  header p { font-size: 12px; color: #8b949e; margin: 4px 0 0; }
  #chat { flex: 1; overflow-y: auto; padding: 20px; display: flex;
          flex-direction: column; gap: 12px; max-width: 760px; width: 100%;
          margin: 0 auto; box-sizing: border-box; }
  .msg { padding: 10px 14px; border-radius: 12px; max-width: 85%;
         line-height: 1.45; white-space: pre-wrap; }
  .user { align-self: flex-end; background: #1f6feb; }
  .steward { align-self: flex-start; background: #161b22;
             border: 1px solid #30363d; }
  .tools { align-self: flex-start; font-size: 12px; color: #8b949e;
           max-width: 85%; }
  .tools code { background: #161b22; border: 1px solid #30363d;
                border-radius: 6px; padding: 2px 6px; margin-right: 6px;
                display: inline-block; margin-bottom: 4px; }
  #bar { display: flex; gap: 10px; padding: 14px 20px;
         border-top: 1px solid #21262d; max-width: 760px; width: 100%;
         margin: 0 auto; box-sizing: border-box; }
  #input { flex: 1; padding: 10px 14px; border-radius: 10px;
           border: 1px solid #30363d; background: #161b22; color: #e6edf3;
           font-size: 15px; }
  button { padding: 10px 20px; border-radius: 10px; border: none;
           background: #1f6feb; color: white; font-size: 15px; cursor: pointer; }
  button:disabled { opacity: 0.5; cursor: default; }
  .typing { color: #8b949e; font-style: italic; }
  .error { border-color: #f85149; }
  #input:focus-visible, button:focus-visible { outline: 2px solid #58a6ff; outline-offset: 2px; }
</style>
</head>
<body>
<header>
  <h1>Steward</h1>
  <p>Alexa+ Agent Skill - simulated experience. Backed by a live self-hosted MCP server.</p>
</header>
<main id="chat" role="log" aria-live="polite" aria-label="Conversation with Steward"></main>
<form id="bar">
  <input id="input" type="text" placeholder="Ask Steward to run an errand..."
         aria-label="Message to Steward" autocomplete="off" maxlength="2000">
  <button id="send" type="submit">Send</button>
</form>
<script>
const chat = document.getElementById('chat');
const input = document.getElementById('input');
const sendBtn = document.getElementById('send');

function addMsg(cls, text) {
  const d = document.createElement('div');
  d.className = 'msg ' + cls;
  d.textContent = text;
  chat.appendChild(d);
  chat.scrollTop = chat.scrollHeight;
  return d;
}
function addTools(calls) {
  if (!calls || !calls.length) return;
  const d = document.createElement('div');
  d.className = 'tools';
  d.textContent = 'tools used: ';
  calls.forEach(c => {
    const code = document.createElement('code');
    code.textContent = c.name;
    d.appendChild(code);
  });
  chat.appendChild(d);
  chat.scrollTop = chat.scrollHeight;
}

let busy = false;

// Render returns HTML (not JSON) while a cold instance wakes up or on a
// proxy error; never let that surface as "Unexpected token <".
async function readJson(r) {
  try { return await r.json(); } catch (_) { return {}; }
}

function errorText(status, data) {
  // data.detail is only present when Steward itself answered (JSON); a cold
  // host or proxy error page has no detail.
  const detail = typeof data.detail === 'string' ? data.detail
    : (data.detail ? JSON.stringify(data.detail) : '');
  if (status === 429) return 'Too many requests. Please wait a minute and try again.';
  if (status === 413) return 'That message is too long. Please shorten it.';
  if (status === 503 && detail) return 'Steward is not set up yet: ' + detail;
  if (status === 502 && detail)
    return 'Steward could not finish that request: the model or the MCP server failed. ' +
      'Check that both are running and configured, then try again.';
  if (status === 502 || status === 503 || status === 504)
    return 'Steward is waking up or temporarily unavailable. Please try again in a moment.';
  return 'Error: ' + (detail || status);
}

async function send() {
  const text = input.value.trim();
  if (!text || busy) return;
  busy = true;
  input.value = '';
  sendBtn.disabled = true;
  addMsg('user', text);
  const typing = addMsg('steward typing', 'Steward is working...');
  try {
    const headers = {'Content-Type': 'application/json'};
    const key = localStorage.getItem('stewardKey');
    if (key) headers['X-Steward-Key'] = key;
    const r = await fetch('/api/chat', {
      method: 'POST',
      headers: headers,
      body: JSON.stringify({message: text})
    });
    const data = await readJson(r);
    typing.remove();
    if (r.status === 401) {
      // The server has STEWARD_API_KEY set: ask once, keep it in this browser.
      const entered = window.prompt('This Steward demo needs an access key:');
      if (entered) localStorage.setItem('stewardKey', entered.trim());
      addMsg('steward', entered ? 'Key saved. Please send your message again.' : 'An access key is required.');
    } else if (!r.ok) {
      addMsg('steward error', errorText(r.status, data));
    } else {
      addMsg('steward', data.reply);
      addTools(data.tool_calls);
    }
  } catch (e) {
    typing.remove();
    addMsg('steward error', 'Could not reach Steward. Check your connection and try again.');
  }
  busy = false;
  sendBtn.disabled = false;
  input.focus();
}
document.getElementById('bar').onsubmit = e => { e.preventDefault(); send(); };
addMsg('steward', 'Hi, I am Steward. Ask me to plan your day, set reminders, or keep notes.');
input.focus();
</script>
</body>
</html>
